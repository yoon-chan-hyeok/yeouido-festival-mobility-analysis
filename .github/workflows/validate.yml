name: Validate public analysis

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce public outputs
        run: python reproduce_public.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Validate release
        run: python validate_release.py
